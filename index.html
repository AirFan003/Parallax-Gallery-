<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corridor · Three.js</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #010104;
      }
      #gallery-stage {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #gallery-stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="gallery-stage"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
